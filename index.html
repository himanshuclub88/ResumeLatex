<head>
    <meta charset="UTF-8">

    <title>Himanshu Singh — Resume</title>

    <style>
        /* =========================================================
   RESET
   ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202124;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================================================
   PDF VIEWER
   ========================================================= */

        .pdf-container {
            position: fixed;
            inset: 0;
            background: #202124;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            background: #202124;
        }


        /* =========================================================
   CONTACT PANEL
   ========================================================= */

        .custom-contact {
            position: fixed;
            left: 14px;
            bottom: 14px;

            width: 235px;
            height: 82px;
            padding: 10px 12px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(25, 26, 28, 0.95);
            border-radius: 10px;

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.30);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            z-index: 1000;

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                visibility 0.25s ease;
        }


        /* =========================================================
   TITLE
   ========================================================= */

        .contact-title {
            margin-bottom: 8px;

            color: rgba(255, 255, 255, 0.65);

            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.7px;

            text-transform: uppercase;
        }


        /* =========================================================
   CONTACT LINKS
   ========================================================= */

        .contact-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .contact-link {
            position: relative;

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #e8eaed;
            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9px;

            text-decoration: none;
            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                color 0.2s ease;
        }

        .contact-link svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .contact-link:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }

        .contact-link:active {
            transform: translateY(0);
        }


        /* =========================================================
   TOOLTIP
   ========================================================= */

        .tooltip {
            position: absolute;
            left: 50%;
            bottom: 45px;

            padding: 5px 8px;

            white-space: nowrap;

            color: #ffffff;
            background: #303134;

            border-radius: 5px;

            font-size: 11px;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transform: translateX(-50%) translateY(4px);

            transition:
                opacity 0.15s ease,
                transform 0.15s ease;
        }

        .contact-link:hover .tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }


        /* =========================================================
   CLOSE BUTTON
   ========================================================= */

        .contact-close {
            position: absolute;
            top: 5px;
            right: 7px;

            width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            color: rgba(255, 255, 255, 0.40);
            background: transparent;

            border: none;
            border-radius: 50%;

            font-size: 13px;

            cursor: pointer;
        }

        .contact-close:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.10);
        }


        /* =========================================================
   COLLAPSED CONTACT BUTTON
   ========================================================= */

        .contact-reopen {
            position: fixed;
            left: 14px;
            bottom: 14px;

            width: 48px;
            height: 38px;

            display: none;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background: rgba(32, 33, 36, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.30);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            cursor: pointer;

            z-index: 1001;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .contact-reopen svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .contact-reopen:hover {
            transform: translateY(-1px);
            background: rgba(48, 49, 52, 0.98);
        }


        /* =========================================================
   SUBTLE COLLAPSED BUTTON PULSE
   ========================================================= */

        @keyframes subtlePulse {

            0%,
            100% {
                background: rgba(32, 33, 36, 0.95);
            }

            50% {
                background: rgba(48, 49, 52, 0.97);
            }
        }

        .contact-reopen {
            animation: subtlePulse 2.8s ease-in-out infinite;
        }

        .contact-reopen:hover {
            animation: none;
        }


        /* =========================================================
   MOBILE
   ========================================================= */

        @media (max-width: 700px) {

            .custom-contact {
                left: 10px;
                bottom: 10px;

                width: 220px;
                height: 78px;
            }

            .contact-link {
                width: 35px;
                height: 35px;
            }

            .contact-reopen {
                left: 10px;
                bottom: 10px;
            }
        }

        /* =========================================================
           MOVING BORDER
           Only the bright border segment moves.
           The panel itself never rotates.
           One 360° trip uses the same duration as CONTACT_OPEN_TIME.
           ========================================================= */

        .contact-border-orbit {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            z-index: 2;
        }

        .contact-border-runner {
            fill: none;
            stroke: var(--orbit-color, #62d9ff);
            stroke-width: 1.8;
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
            pointer-events: none;

            /* Exactly ONE bright dash. JS calculates the real perimeter. */
            stroke-dasharray: 28 var(--border-gap, 570px);
            stroke-dashoffset: 0;
            animation: none;
        }

        .custom-contact.border-running .contact-border-runner {
            animation:
                border360 var(--orbit-duration, 25s) linear 1,
                borderColor var(--orbit-duration, 25s) linear 1;
        }

        @keyframes border360 {
            from { stroke-dashoffset: 0; }
            to   { stroke-dashoffset: calc(-1 * var(--border-length, 600px)); }
        }

        @keyframes borderColor {
            0%   { --orbit-color: #62d9ff; }
            20%  { --orbit-color: #6f8cff; }
            40%  { --orbit-color: #a77cff; }
            60%  { --orbit-color: #6fe0c0; }
            80%  { --orbit-color: #62d9ff; }
            100% { --orbit-color: #62d9ff; }
        }


   /* =========================================================
   REDUCED MOTION
   ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .custom-contact,
            .contact-link,
            .contact-reopen,
            .tooltip {
                transition: none;
            }

            .custom-contact.border-running .contact-border-runner {
                animation: none;
            }

            .contact-reopen {
                animation: none;
            }
        }
    </style>
</head>

<script>

    const contactPanel = document.getElementById("contactPanel");
    const closeContact = document.getElementById("closeContact");
    const reopenContact = document.getElementById("reopenContact");

    /*
     * ONE value controls both:
     *   - how long the border takes to make one complete round
     *   - how long the panel stays open
     *
     * Change this to 5000 for 5 seconds, 6000 for 6 seconds, etc.
     */
    const CONTACT_OPEN_TIME = 6000;

    let collapseTimer;

    function updateBorderGeometry() {
        const svg = contactPanel.querySelector(".contact-border-orbit");
        const rect = contactPanel.querySelector(".contact-border-runner");

        if (!svg || !rect) return;

        const width = contactPanel.clientWidth;
        const height = contactPanel.clientHeight;

        // Keep SVG user units equal to the actual panel dimensions.
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

        rect.setAttribute("x", "1");
        rect.setAttribute("y", "1");
        rect.setAttribute("width", String(Math.max(0, width - 2)));
        rect.setAttribute("height", String(Math.max(0, height - 2)));
        rect.setAttribute("rx", "10");
        rect.setAttribute("ry", "10");

        const length = rect.getTotalLength();
        const dashLength = Math.min(28, Math.max(12, length * 0.055));
        const gapLength = Math.max(1, length - dashLength);

        rect.style.strokeDasharray = `${dashLength}px ${gapLength}px`;
        contactPanel.style.setProperty("--border-length", `${length}px`);
        contactPanel.style.setProperty("--border-gap", `${gapLength}px`);
    }

    function startBorderOrbit() {
        updateBorderGeometry();

        contactPanel.style.setProperty(
            "--orbit-duration",
            `${CONTACT_OPEN_TIME}ms`
        );

        contactPanel.classList.remove("border-running");
        void contactPanel.offsetWidth;
        contactPanel.classList.add("border-running");
    }

    /* =========================================================
       COLLAPSE
       ========================================================= */

    function collapseContact() {

        clearTimeout(collapseTimer);

        // Stop the border immediately when the panel closes.
        contactPanel.classList.remove("border-running");

        contactPanel.style.opacity = "0";
        contactPanel.style.transform = "translateY(8px)";
        contactPanel.style.visibility = "hidden";

        // Collapsed button is completely static.
        reopenContact.style.display = "flex";
    }


    /* =========================================================
       EXPAND
       ========================================================= */

    function expandContact() {

        clearTimeout(collapseTimer);

        reopenContact.style.display = "none";

        contactPanel.style.opacity = "1";
        contactPanel.style.transform = "translateY(0)";
        contactPanel.style.visibility = "visible";

        // Start one fresh border revolution.
        startBorderOrbit();

        // Collapse at exactly the same time the border completes.
        collapseTimer = setTimeout(collapseContact, CONTACT_OPEN_TIME);
    }


    /* =========================================================
       EVENTS
       ========================================================= */

    closeContact.addEventListener("click", collapseContact);

    reopenContact.addEventListener("click", expandContact);

    window.addEventListener("resize", updateBorderGeometry);

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            collapseContact();
        }
    });


    /* =========================================================
       INITIAL STATE
       ========================================================= */

    // Initial open state: calculate the perimeter first.
    updateBorderGeometry();

    contactPanel.style.setProperty(
        "--orbit-duration",
        `${CONTACT_OPEN_TIME}ms`
    );

    contactPanel.classList.add("border-running");

    collapseTimer = setTimeout(
        collapseContact,
        CONTACT_OPEN_TIME
    );

</script>
